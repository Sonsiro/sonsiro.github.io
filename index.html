<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9f1f6">
  <meta name="description" content="Ứng dụng của bạn, tải nhanh và đơn giản.">
  <title>Sơn Sirô - Apps</title>
  <link rel="icon" type="image/png" href="assets/appstore-logo.png">
  <link rel="apple-touch-icon" href="assets/appstore-logo.png">
  <link rel="stylesheet" href="input-navigation.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #172a3b;
      --muted: #607487;
      --green: #168b54;
      --glass: rgba(255, 255, 255, .47);
      --line: rgba(255, 255, 255, .8);
      --shadow: 0 20px 65px rgba(49, 104, 123, .13), inset 0 1px 0 rgba(255,255,255,.9);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 4% 17%, rgba(116, 205, 255, .56), transparent 34rem),
        radial-gradient(ellipse at 96% 12%, rgba(255, 235, 143, .58), transparent 34rem),
        radial-gradient(ellipse at 48% 75%, rgba(145, 231, 178, .50), transparent 36rem),
        radial-gradient(ellipse at 71% 43%, rgba(177, 170, 255, .17), transparent 27rem),
        linear-gradient(135deg, #e5f7fb 0%, #edf8ec 50%, #fff8dd 100%);
      background-attachment: fixed;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      z-index: -1;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 50%;
      filter: blur(1px);
    }
    body::before { width: 58vw; height: 58vw; left: -30vw; top: 22vh; box-shadow: inset -18px 8px 45px rgba(255,255,255,.35), 0 0 60px rgba(255,255,255,.34); }
    body::after { width: 48vw; height: 48vw; right: -23vw; top: 45vh; box-shadow: inset 16px -12px 45px rgba(255,255,255,.35), 0 0 60px rgba(255,255,255,.34); }
    button, input { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1180px, 86%); margin: 0 auto; }
    .glass {
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255,255,255,.65), rgba(255,255,255,.31) 54%, rgba(255,255,255,.49));
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      backdrop-filter: blur(24px) saturate(155%);
    }
    .topbar {
      position: sticky;
      z-index: 10;
      top: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 70px;
      margin-top: 7px;
      padding: 10px 14px 10px 17px;
      border-radius: 23px;
    }
    .brand { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 11px; }
    .logo {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 15px;
      color: #fff;
      font-size: 24px;
      font-weight: 950;
      background: linear-gradient(145deg, #5fd494, #169a5d 55%, #0b7040);
      box-shadow: inset 0 1px 2px rgba(255,255,255,.55), 0 7px 22px rgba(28, 150, 87, .32);
      text-shadow: 0 1px 2px rgba(0, 60, 35, .35);
    }
    .brand-name { font-size: 17px; font-weight: 850; letter-spacing: -.02em; color: #14324a; }
    .brand-name em { font-style: normal; background: linear-gradient(120deg, #149a5f, #0a6d43); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .categories { display: flex; flex: 0 0 auto; align-items: center; gap: 4px; margin: 0 auto; overflow-x: auto; padding: 3px; border: 1px solid rgba(255,255,255,.64); border-radius: 999px; background: rgba(255,255,255,.22); scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat {
      flex: 0 0 auto;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: #506779;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: .2s ease;
    }
    .cat:hover { color: var(--ink); background: rgba(255,255,255,.38); }
    .cat.active {
      color: #0c603c;
      border-color: rgba(255,255,255,.88);
      background: linear-gradient(140deg, rgba(255,255,255,.8), rgba(148,239,174,.66));
      box-shadow: inset 0 1px 0 #fff, 0 5px 20px rgba(91, 198, 125, .2);
    }
    .hero { padding: 19px 0 9px; text-align: center; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: #168353; font-size: 11px; font-weight: 850; letter-spacing: .18em; }
    .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #53c779; box-shadow: 0 0 15px rgba(67,199,111,.72); }
    h1 { margin: 0 0 4px; font-size: clamp(28px, 3vw, 36px); line-height: 1; letter-spacing: -.065em; font-weight: 850; }
    .hero-mark { display: block; width: clamp(96px, 11vw, 132px); height: auto; margin: 4px auto 6px; filter: drop-shadow(0 14px 24px rgba(20, 120, 85, .28)); }
    .intro { margin: 0 auto; color: #50687d; font-size: 12px; }
    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(320px, 100%);
      height: 36px;
      flex: 0 1 320px;
      margin: 10px auto 0;
      padding: 0 11px 0 14px;
      border-radius: 14px;
      text-align: left;
    }
    .search-icon { display: grid; flex: 0 0 auto; place-items: center; color: #5f7f94; }
    .search-icon svg { width: 17px; height: 17px; }
    .search input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 14px; }
    .search input::placeholder { color: #73899a; }
    kbd { flex: 0 0 auto; padding: 5px 8px; border: 1px solid rgba(110,145,165,.24); border-radius: 8px; color: #6b8294; background: rgba(255,255,255,.33); font-size: 10px; }
    .today {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      margin: 14px auto 0;
      padding: 9px 16px 9px 10px;
      border-radius: 18px;
      text-align: left;
    }
    .today-icon { display: grid; flex: 0 0 auto; width: 38px; height: 38px; place-items: center; border-radius: 12px; color: #fff; background: linear-gradient(145deg, #5fd494, #169a5d 58%, #0b7040); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 8px 18px rgba(22,154,93,.25); }
    .today-icon svg { width: 20px; height: 20px; }
    .today-time { display: block; color: #123c2a; font-size: 19px; font-weight: 850; letter-spacing: .05em; font-variant-numeric: tabular-nums; line-height: 1; }
    .today-sep { width: 1px; align-self: stretch; background: rgba(110,145,165,.25); }
    .today-solar { display: block; color: #2f4a3d; font-size: 11px; font-weight: 700; }
    .today-lunar { display: block; margin-top: 2px; color: #5f7f94; font-size: 10px; font-weight: 550; }
    .apps { padding: 0 0 26px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    .section-head h2 { margin: 0; font-size: 21px; letter-spacing: -.045em; }
    .count { display: block; margin-top: 2px; color: #60788a; font-size: 10px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .card {
      position: relative;
      display: flex;
      min-height: 124px;
      flex-direction: column;
      overflow: hidden;
      padding: 11px 12px 9px;
      border-radius: 16px;
      transition: transform .24s ease, box-shadow .24s ease, border-color .24s ease;
    }
    .card::before {
      position: absolute;
      top: -74px;
      right: -73px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.65), rgba(161,225,255,.13) 48%, transparent 72%);
      content: "";
      pointer-events: none;
    }
    .card::after { position: absolute; inset: 1px; border: 1px solid rgba(255,255,255,.32); border-radius: inherit; content: ""; pointer-events: none; }
    .card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,.98); box-shadow: 0 26px 68px rgba(47, 112, 130, .18), inset 0 1px 0 #fff; }
    .card-top { position: relative; display: flex; align-items: center; gap: 11px; }
    .icon {
      display: grid;
      width: 49px;
      height: 49px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #47c9e7, #188ebc 58%, #146c99);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 9px 20px rgba(34, 129, 161, .22);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -.04em;
      text-shadow: 0 1px 3px rgba(0,0,0,.15);
    }
    .icon.phone { color: #087347; background: linear-gradient(145deg, #e5fff0, #9cebb5 55%, #58cb89); }
    .icon.vpn { color: #fff; background: linear-gradient(145deg, #c7baff, #9079eb 55%, #6353bf); }
    .icon.tt { background: linear-gradient(145deg, #77c9f3, #388fda 58%, #3168bb); }
    .icon.st { background: linear-gradient(145deg, #ff9c8f, #e85256 58%, #c8333b); }
    .icon.go { background: linear-gradient(145deg, #ffc477, #f28b36 58%, #d76524); }
    .icon.sb { background: linear-gradient(145deg, #8ee3f0, #2bb3c7 58%, #12879b); }
    .icon.cf { background: linear-gradient(145deg, #ffe9a8, #f6c344 58%, #dd9a12); }
    .icon.cb { background: linear-gradient(145deg, #9fb8ff, #4a6fd6 58%, #2c48a3); }
    .icon.fr { background: linear-gradient(145deg, #ff8fa0, #e02d55 58%, #a81240); }
    .icon.kk { background: linear-gradient(145deg, #ffc3e0, #ef7fbb 58%, #c94f92); }
    .icon.ms { background: linear-gradient(145deg, #b7c6d1, #7b93a5 58%, #566c7e); }
    .icon.so { background: linear-gradient(145deg, #d5a8ff, #a86ae0 58%, #7d3fb0); }
    .icon.va { background: linear-gradient(145deg, #a8e6c9, #4cb98a 58%, #2a8a62); }
    .icon svg { width: 29px; height: 29px; }
    .card.featured { grid-column: 1 / -1; min-height: 0; }
    .card.featured .icon { width: 56px; height: 56px; border-radius: 16px; }
    .card.featured .icon svg { width: 33px; height: 33px; }
    .card.featured .app-name { font-size: 16px; }
    .card.featured p { font-size: 10px; }
    .tag-new { display: inline-block; margin-left: 7px; padding: 2px 7px; border-radius: 999px; color: #c23844; background: linear-gradient(140deg, #fff0f1, #ffdbe0); font-size: 8px; font-weight: 850; letter-spacing: .06em; vertical-align: 2px; }
    .card-meta { min-width: 0; }
    .card h3 { margin: 0; color: #718797; font-size: 10px; font-weight: 550; letter-spacing: -.01em; }
    .app-name { display: block; margin-top: 1px; color: #172a3b; font-size: 14px; font-weight: 800; line-height: 1.2; }
    .card p { min-height: 24px; margin: 2px 0 0 60px; color: #536c7e; font-size: 9px; line-height: 1.35; }
    .bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 5px; }
    .version { padding: 3px 8px; border: 1px solid rgba(255,255,255,.8); border-radius: 999px; color: #30634d; background: rgba(192,245,207,.53); font-size: 8px; font-weight: 700; }
    .download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border: 1px solid rgba(36, 158, 89, .45);
      border-radius: 999px;
      color: #14583d;
      background: linear-gradient(145deg, rgba(255,255,255,.82), rgba(219,255,229,.54));
      box-shadow: inset 0 1px 0 #fff, 0 6px 16px rgba(44, 155, 91, .13);
      font-size: 9px;
      font-weight: 800;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .download:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 #fff, 0 9px 22px rgba(44,155,91,.2); }
    .download span { font-size: 13px; line-height: 10px; }
    .empty { grid-column: 1 / -1; padding: 44px 20px; border-radius: 24px; color: var(--muted); text-align: center; }
    .tv-banner {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 6px 0 14px;
      padding: 18px 20px;
      border-radius: 24px;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(120deg, rgba(24,62,118,.93), rgba(16,106,138,.9) 55%, rgba(12,132,104,.9));
      box-shadow: 0 18px 40px rgba(15,75,115,.28), inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .tv-banner:hover { transform: translateY(-2px); box-shadow: 0 24px 48px rgba(15,75,115,.34), inset 0 1px 0 rgba(255,255,255,.32); }
    .tv-icon { display: grid; flex: 0 0 auto; width: 56px; height: 56px; place-items: center; border-radius: 16px; color: #fff; background: rgba(255,255,255,.15); box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
    .tv-icon svg { width: 32px; height: 32px; }
    .tv-text { flex: 1; min-width: 0; }
    .tv-text strong { display: block; font-size: 17px; font-weight: 850; letter-spacing: .01em; }
    .tv-text small { display: block; margin-top: 3px; color: rgba(255,255,255,.82); font-size: 11px; }
    .tv-live { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(237,56,74,.92); font-size: 8px; font-weight: 850; letter-spacing: .08em; vertical-align: 3px; }
    .tv-live::before { width: 5px; height: 5px; border-radius: 50%; background: #fff; content: ""; animation: tv-pulse 1.6s ease infinite; }
    @keyframes tv-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .tv-cta { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 999px; color: #0b4d68; background: rgba(255,255,255,.95); box-shadow: 0 6px 16px rgba(0,0,0,.16); font-size: 11px; font-weight: 800; }
    .dock {
      position: fixed;
      z-index: 20;
      bottom: 18px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px;
      border-radius: 28px;
      transform: translateX(-50%);
    }
    .dock a, .dock button {
      display: grid;
      width: 62px;
      min-height: 58px;
      place-items: center;
      align-content: center;
      gap: 3px;
      border: 0;
      border-radius: 19px;
      color: #587185;
      background: none;
      font: inherit;
      cursor: pointer;
      transition: .2s ease;
    }
    .dock a:hover, .dock a.active, .dock button:hover { color: #126a41; background: linear-gradient(145deg, rgba(255,255,255,.77), rgba(177,240,190,.58)); box-shadow: inset 0 1px 0 #fff, 0 5px 15px rgba(65,145,93,.1); }
    .dock-icon { font-size: 21px; line-height: 1; }
    .dock small { font-size: 9px; font-weight: 650; }
    footer { padding: 6px 0 118px; color: #718696; font-size: 11px; text-align: center; }
    :focus-visible { outline: 3px solid rgba(31,157,91,.6); outline-offset: 3px; }
    @media (max-width: 720px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .wrap { width: calc(100% - 24px); }
      .topbar { top: 7px; display: flex; flex-wrap: wrap; margin-top: 7px; padding: 9px 11px 8px; border-radius: 19px; }
      .brand { margin-bottom: 0; }
      .brand-name { font-size: 15px; }
      .logo { width: 34px; height: 34px; border-radius: 12px; font-size: 20px; }
      .categories { order: 2; width: 100%; justify-content: space-between; gap: 2px; }
      .cat { padding: 8px 10px; font-size: 11px; }
      .search { width: min(320px, 100%); height: 36px; flex: 0 1 320px; border-radius: 14px; padding: 0 10px; }
      .search-icon { font-size: 20px; }
      .search input { font-size: 12px; }
      .hero { padding: 17px 0 9px; }
      h1 { font-size: 26px; }
      .intro { font-size: 10px; }
      .apps { padding-bottom: 18px; }
      .section-head { margin-bottom: 8px; }
      .section-head h2 { font-size: 20px; }
      .count { font-size: 11px; }
      .grid { grid-template-columns: 1fr; gap: 10px; }
      .card { min-height: 124px; padding: 11px 12px 9px; border-radius: 16px; }
      .card-top { gap: 11px; }
      .icon { width: 49px; height: 49px; border-radius: 13px; font-size: 16px; }
      .card h3 { margin: 0; color: #718797; font-size: 10px; font-weight: 550; }
      .app-name { font-size: 13px; }
      .card p { min-height: 24px; margin: 2px 0 0 60px; font-size: 9px; }
      .bottom { padding-top: 5px; }
      .dock { bottom: 9px; gap: 2px; padding: 6px; border-radius: 22px; }
      .dock a, .dock button { width: 55px; min-height: 49px; border-radius: 15px; }
      .tv-banner { flex-wrap: wrap; gap: 12px; margin-bottom: 22px; padding: 14px; border-radius: 18px; }
      .tv-icon { width: 46px; height: 46px; border-radius: 13px; }
      .tv-icon svg { width: 26px; height: 26px; }
      .tv-text { flex-basis: calc(100% - 58px); }
      .tv-text strong { font-size: 15px; }
      .tv-cta { justify-content: center; width: 100%; }
      .today { gap: 10px; padding: 8px 13px 8px 9px; border-radius: 15px; }
      .today-icon { width: 34px; height: 34px; border-radius: 10px; }
      .today-time { font-size: 16px; }
      .today-solar { font-size: 10px; }
      .today-lunar { font-size: 9px; }
      footer { padding-bottom: 108px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar glass">
      <a class="brand" href="#top" aria-label="Sơn Sirô Home"><span class="logo">S</span><span class="brand-name">Sơn <em>Sirô</em></span></a>
      <nav class="categories" aria-label="Danh mục ứng dụng">
        <button class="cat active" type="button" data-cat="all" aria-pressed="true">Tất cả</button>
        <button class="cat" type="button" data-cat="tv" aria-pressed="false">TV</button>
        <button class="cat" type="button" data-cat="android" aria-pressed="false">Android</button>
        <button class="cat" type="button" data-cat="vpn" aria-pressed="false">VPN</button>
        <button class="cat" type="button" data-cat="tools" aria-pressed="false">Tools</button>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title" aria-label="SONSIRO APP STORE"><img class="hero-mark" src="assets/appstore-logo.png" alt="Sonsiro App Store"></h1>
        <p class="intro">Ứng dụng của bạn, tải nhanh và đơn giản.</p>
        <div class="today glass" role="status" aria-label="Đồng hồ và lịch hôm nay">
          <span class="today-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8.2" stroke="currentColor" stroke-width="2"/><path d="M12 8.8V13l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 2.8h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          <span><strong class="today-time" id="clock">--:--:--</strong></span>
          <span class="today-sep" aria-hidden="true"></span>
          <span><span class="today-solar" id="solar"></span><span class="today-lunar" id="lunar"></span></span>
        </div>
        <label class="search glass">
          <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <input id="search" type="search" placeholder="Tìm ứng dụng..." autocomplete="off" aria-label="Tìm ứng dụng">
          <kbd>⌘ K</kbd>
        </label>
      </section>
      <section class="apps" id="apps" aria-labelledby="apps-title">
        <div class="section-head"><div><h2 id="apps-title">Ứng dụng</h2><span class="count" id="count" aria-live="polite"></span></div></div>
        <div class="grid" id="grid" data-gesture-surface role="group" aria-label="Danh sách ứng dụng"></div>
      </section>
    </main>
    <section class="tv-online" aria-label="Xem Ti Vi Online">
      <a class="tv-banner" href="https://hoangcongson.github.io/tv/" target="_blank" rel="noreferrer">
        <span class="tv-icon" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><rect x="4.5" y="7" width="27" height="17" rx="3" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 12.5 6.5 4-6.5 4Z" fill="currentColor"/><path d="M12 29h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span>
        <span class="tv-text"><strong>Xem Ti Vi Online<span class="tv-live">TRỰC TUYẾN</span></strong><small>Xem truyền hình trực tuyến miễn phí ngay trên trình duyệt — không cần cài đặt.</small></span>
        <span class="tv-cta">Xem ngay <span aria-hidden="true">↗</span></span>
      </a>
    </section>
    <footer>© 2026 Sonsiro · Liquid Glass App Store</footer>
  </div>

    // Đồng hồ + lịch âm (thuật toán Hồ Ngọc Đức, múi giờ GMT+7)
    const clockEl = document.querySelector("#clock");

    const WEEKDAYS = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

    const pad2 = n => String(n).padStart(2, "0");
    function jdFromDate(dd, mm, yy) {
      const a = Math.floor((14 - mm) / 12);
      const y = yy + 4800 - a;
      const m = mm + 12 * a - 3;
      let jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
      if (jd < 2299161) jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - 32083;
      return jd;
    }
    function getNewMoonDay(k, tz) {
      const T = k / 1236.85;
      const T2 = T * T, T3 = T2 * T;
      const dr = Math.PI / 180;
      let jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
      jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
      const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
      const Mpr = 306.0253 + 385.81693528 * k + 0.0107306 * T2 + 0.00001236 * T3;
      const F = 21.2964 + 390.67050645 * k - 0.0016528 * T2 - 0.00000239 * T3;
      let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
      C1 = C1 - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr);
      C1 = C1 - 0.0004 * Math.sin(dr * 3 * Mpr) + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr));
      C1 = C1 - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M));
      C1 = C1 - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr));
      C1 = C1 + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
      const deltat = T < -11 ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3 : -0.000278 + 0.000265 * T + 0.000262 * T2;
      return Math.floor(jd1 + C1 - deltat + 0.5 + tz / 24);
    }
    function getSunLongitude(jdn, tz) {
      const T = (jdn - 2451545.5 - tz / 24) / 36525;
      const T2 = T * T;
      const dr = Math.PI / 180;
      const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
      const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
      let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
      DL += (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
      let L = (L0 + DL) * dr;
      L = L - Math.PI * 2 * Math.floor(L / (Math.PI * 2));
      return Math.floor(L / Math.PI * 6);
    }
    function getLunarMonth11(yy, tz) {
      const off = jdFromDate(31, 12, yy) - 2415021;
      const k = Math.floor(off / 29.530588853);
      let nm = getNewMoonDay(k, tz);
      if (getSunLongitude(nm, tz) >= 9) nm = getNewMoonDay(k - 1, tz);
      return nm;
    }
    function getLeapMonthOffset(a11, tz) {
      const k = Math.floor((a11 - 2415021.076998695) / 29.530588853 + 0.5);
      let last = 0;
      let i = 1;
      let arc = getSunLongitude(getNewMoonDay(k + i, tz), tz);
      do {
        last = arc;
        i++;
        arc = getSunLongitude(getNewMoonDay(k + i, tz), tz);
      } while (arc !== last && i < 14);
      return i - 1;
    }
    function solarToLunar(dd, mm, yy, tz) {
      const dayNumber = jdFromDate(dd, mm, yy);
      const k = Math.floor((dayNumber - 2415021.076998695) / 29.530588853);
      let monthStart = getNewMoonDay(k + 1, tz);
      if (monthStart > dayNumber) monthStart = getNewMoonDay(k, tz);
      let a11 = getLunarMonth11(yy, tz);
      let b11 = a11;
      let lunarYear;
      if (a11 >= monthStart) {
        lunarYear = yy;
        a11 = getLunarMonth11(yy - 1, tz);
      } else {
        lunarYear = yy + 1;
        b11 = getLunarMonth11(yy + 1, tz);
      }
      const lunarDay = dayNumber - monthStart + 1;
      const diff = Math.floor((monthStart - a11) / 29);
      let lunarLeap = 0;
      let lunarMonth = diff + 11;
      if (b11 - a11 > 365) {
        const leapMonthDiff = getLeapMonthOffset(a11, tz);
        if (diff >= leapMonthDiff) {
          lunarMonth = diff + 10;
          if (diff === leapMonthDiff) lunarLeap = 1;
        }
      }
      if (lunarMonth > 12) lunarMonth -= 12;
      if (lunarMonth >= 11 && diff < 4) lunarYear -= 1;
      return [lunarDay, lunarMonth, lunarYear, lunarLeap];
    }
    function tick() {
      const now = new Date();
      clockEl.textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
      const d = now.getDate(), m = now.getMonth() + 1, y = now.getFullYear();
      solarEl.textContent = `${WEEKDAYS[now.getDay()]}, ${pad2(d)}/${pad2(m)}/${y}`;
      const [ld, lm, ly, leap] = solarToLunar(d, m, y, 7);
      const dayName = ld === 1 ? "Mùng 1" : ld === 15 ? "Rằm" : ld;
      lunarEl.textContent = `Âm lịch: ${dayName} tháng ${lm}${leap ? " nhuận" : ""} năm ${CAN[(ly + 6) % 10]} ${CHI[(ly + 8) % 12]}`;
    }
    tick();
    setInterval(tick, 1000);
