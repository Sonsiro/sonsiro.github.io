<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9f1f6">
  <meta name="description" content="Ứng dụng của bạn, tải nhanh và đơn giản.">
  <title>Sonsiro — Apps</title>
  <link rel="stylesheet" href="input-navigation.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #172a3b;
      --muted: #607487;
      --green: #168b54;
      --glass: rgba(255, 255, 255, .47);
      --line: rgba(255, 255, 255, .8);
      --shadow: 0 20px 65px rgba(49, 104, 123, .13), inset 0 1px 0 rgba(255,255,255,.9);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 4% 17%, rgba(116, 205, 255, .56), transparent 34rem),
        radial-gradient(ellipse at 96% 12%, rgba(255, 235, 143, .58), transparent 34rem),
        radial-gradient(ellipse at 48% 75%, rgba(145, 231, 178, .50), transparent 36rem),
        radial-gradient(ellipse at 71% 43%, rgba(177, 170, 255, .17), transparent 27rem),
        linear-gradient(135deg, #e5f7fb 0%, #edf8ec 50%, #fff8dd 100%);
      background-attachment: fixed;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      z-index: -1;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 50%;
      filter: blur(1px);
    }
    body::before { width: 58vw; height: 58vw; left: -30vw; top: 22vh; box-shadow: inset -18px 8px 45px rgba(255,255,255,.35), 0 0 60px rgba(255,255,255,.34); }
    body::after { width: 48vw; height: 48vw; right: -23vw; top: 45vh; box-shadow: inset 16px -12px 45px rgba(255,255,255,.35), 0 0 60px rgba(255,255,255,.34); }
    button, input { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1180px, 86%); margin: 0 auto; }
    .glass {
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255,255,255,.65), rgba(255,255,255,.31) 54%, rgba(255,255,255,.49));
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      backdrop-filter: blur(24px) saturate(155%);
    }
    .topbar {
      position: sticky;
      z-index: 10;
      top: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 70px;
      margin-top: 7px;
      padding: 10px 14px 10px 17px;
      border-radius: 23px;
    }
    .brand { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 11px; font-weight: 900; letter-spacing: -.035em; }
    .logo {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 15px;
      color: #08643c;
      font-size: 24px;
      font-weight: 950;
      background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(126,232,161,.77));
      box-shadow: inset 0 1px 2px #fff, 0 7px 22px rgba(28, 150, 87, .2);
      text-shadow: 0 1px 0 rgba(255,255,255,.85);
    }
    .categories { display: flex; flex: 0 0 auto; align-items: center; gap: 4px; margin: 0 auto; overflow-x: auto; padding: 3px; border: 1px solid rgba(255,255,255,.64); border-radius: 999px; background: rgba(255,255,255,.22); scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat {
      flex: 0 0 auto;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: #506779;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: .2s ease;
    }
    .cat:hover { color: var(--ink); background: rgba(255,255,255,.38); }
    .cat.active {
      color: #0c603c;
      border-color: rgba(255,255,255,.88);
      background: linear-gradient(140deg, rgba(255,255,255,.8), rgba(148,239,174,.66));
      box-shadow: inset 0 1px 0 #fff, 0 5px 20px rgba(91, 198, 125, .2);
    }
    .hero { padding: 19px 0 9px; text-align: center; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: #168353; font-size: 11px; font-weight: 850; letter-spacing: .18em; }
    .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #53c779; box-shadow: 0 0 15px rgba(67,199,111,.72); }
    h1 { margin: 0 0 4px; font-size: clamp(28px, 3vw, 36px); line-height: 1; letter-spacing: -.065em; font-weight: 850; }
    .hero-mark { display: block; width: clamp(160px, 18vw, 230px); height: auto; margin: -10px auto 0; filter: drop-shadow(0 10px 18px rgba(39, 126, 132, .2)); }
    .intro { margin: 0 auto; color: #50687d; font-size: 12px; }
    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(320px, 100%);
      height: 36px;
      flex: 0 1 320px;
      margin: 10px auto 0;
      padding: 0 11px 0 14px;
      border-radius: 14px;
      text-align: left;
    }
    .search-icon { display: grid; flex: 0 0 auto; place-items: center; color: #5f7f94; }
    .search-icon svg { width: 17px; height: 17px; }
    .search input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 14px; }
    .search input::placeholder { color: #73899a; }
    kbd { flex: 0 0 auto; padding: 5px 8px; border: 1px solid rgba(110,145,165,.24); border-radius: 8px; color: #6b8294; background: rgba(255,255,255,.33); font-size: 10px; }
    .apps { padding: 0 0 130px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    .section-head h2 { margin: 0; font-size: 21px; letter-spacing: -.045em; }
    .count { display: block; margin-top: 2px; color: #60788a; font-size: 10px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .card {
      position: relative;
      display: flex;
      min-height: 124px;
      flex-direction: column;
      overflow: hidden;
      padding: 11px 12px 9px;
      border-radius: 16px;
      transition: transform .24s ease, box-shadow .24s ease, border-color .24s ease;
    }
    .card::before {
      position: absolute;
      top: -74px;
      right: -73px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.65), rgba(161,225,255,.13) 48%, transparent 72%);
      content: "";
      pointer-events: none;
    }
    .card::after { position: absolute; inset: 1px; border: 1px solid rgba(255,255,255,.32); border-radius: inherit; content: ""; pointer-events: none; }
    .card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,.98); box-shadow: 0 26px 68px rgba(47, 112, 130, .18), inset 0 1px 0 #fff; }
    .card-top { position: relative; display: flex; align-items: center; gap: 11px; }
    .icon {
      display: grid;
      width: 49px;
      height: 49px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #47c9e7, #188ebc 58%, #146c99);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 9px 20px rgba(34, 129, 161, .22);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -.04em;
      text-shadow: 0 1px 3px rgba(0,0,0,.15);
    }
    .icon.phone { color: #087347; background: linear-gradient(145deg, #e5fff0, #9cebb5 55%, #58cb89); }
    .icon.vpn { color: #fff; background: linear-gradient(145deg, #c7baff, #9079eb 55%, #6353bf); }
    .icon.tt { background: linear-gradient(145deg, #77c9f3, #388fda 58%, #3168bb); }
    .icon.st { background: linear-gradient(145deg, #ff9c8f, #e85256 58%, #c8333b); }
    .icon.go { background: linear-gradient(145deg, #ffc477, #f28b36 58%, #d76524); }
    .icon svg { width: 29px; height: 29px; }
    .card-meta { min-width: 0; }
    .card h3 { margin: 0; color: #718797; font-size: 10px; font-weight: 550; letter-spacing: -.01em; }
    .app-name { display: block; margin-top: 1px; color: #172a3b; font-size: 14px; font-weight: 800; line-height: 1.2; }
    .card p { min-height: 24px; margin: 2px 0 0 60px; color: #536c7e; font-size: 9px; line-height: 1.35; }
    .bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 5px; }
    .version { padding: 3px 8px; border: 1px solid rgba(255,255,255,.8); border-radius: 999px; color: #30634d; background: rgba(192,245,207,.53); font-size: 8px; font-weight: 700; }
    .download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border: 1px solid rgba(36, 158, 89, .45);
      border-radius: 999px;
      color: #14583d;
      background: linear-gradient(145deg, rgba(255,255,255,.82), rgba(219,255,229,.54));
      box-shadow: inset 0 1px 0 #fff, 0 6px 16px rgba(44, 155, 91, .13);
      font-size: 9px;
      font-weight: 800;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .download:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 #fff, 0 9px 22px rgba(44,155,91,.2); }
    .download span { font-size: 13px; line-height: 10px; }
    .empty { grid-column: 1 / -1; padding: 44px 20px; border-radius: 24px; color: var(--muted); text-align: center; }
    .dock {
      position: fixed;
      z-index: 20;
      bottom: 18px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px;
      border-radius: 28px;
      transform: translateX(-50%);
    }
    .dock a {
      display: grid;
      width: 62px;
      min-height: 58px;
      place-items: center;
      align-content: center;
      gap: 3px;
      border-radius: 19px;
      color: #587185;
      transition: .2s ease;
    }
    .dock a:hover, .dock a.active { color: #126a41; background: linear-gradient(145deg, rgba(255,255,255,.77), rgba(177,240,190,.58)); box-shadow: inset 0 1px 0 #fff, 0 5px 15px rgba(65,145,93,.1); }
    .dock-icon { font-size: 21px; line-height: 1; }
    .dock small { font-size: 9px; font-weight: 650; }
    footer { padding: 0 0 36px; color: #718696; font-size: 11px; text-align: center; }
    :focus-visible { outline: 3px solid rgba(31,157,91,.6); outline-offset: 3px; }
    @media (max-width: 720px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .wrap { width: calc(100% - 24px); }
      .topbar { top: 7px; display: flex; flex-wrap: wrap; margin-top: 7px; padding: 9px 11px 8px; border-radius: 19px; }
      .brand { margin-bottom: 0; font-size: 14px; }
      .logo { width: 34px; height: 34px; border-radius: 12px; font-size: 20px; }
      .categories { order: 2; width: 100%; justify-content: space-between; gap: 2px; }
      .cat { padding: 8px 10px; font-size: 11px; }
      .search { width: min(320px, 100%); height: 36px; flex: 0 1 320px; border-radius: 14px; padding: 0 10px; }
      .search-icon { font-size: 20px; }
      .search input { font-size: 12px; }
      .hero { padding: 17px 0 9px; }
      h1 { font-size: 26px; }
      .intro { font-size: 10px; }
      .apps { padding-bottom: 115px; }
      .section-head { margin-bottom: 8px; }
      .section-head h2 { font-size: 20px; }
      .count { font-size: 11px; }
      .grid { grid-template-columns: 1fr; gap: 10px; }
      .card { min-height: 124px; padding: 11px 12px 9px; border-radius: 16px; }
      .card-top { gap: 11px; }
      .icon { width: 49px; height: 49px; border-radius: 13px; font-size: 16px; }
      .card h3 { margin: 0; color: #718797; font-size: 10px; font-weight: 550; }
      .app-name { font-size: 13px; }
      .card p { min-height: 24px; margin: 2px 0 0 60px; font-size: 9px; }
      .bottom { padding-top: 5px; }
      .dock { bottom: 9px; gap: 2px; padding: 6px; border-radius: 22px; }
      .dock a { width: 55px; min-height: 49px; border-radius: 15px; }
      footer { padding-bottom: 28px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar glass">
      <a class="brand" href="#top" aria-label="Sonsiro Home"><span class="logo">S</span><span>SONSIRO</span></a>
      <nav class="categories" aria-label="Danh mục ứng dụng">
        <button class="cat active" type="button" data-cat="all" aria-pressed="true">Tất cả</button>
        <button class="cat" type="button" data-cat="tv" aria-pressed="false">TV</button>
        <button class="cat" type="button" data-cat="android" aria-pressed="false">Android</button>
        <button class="cat" type="button" data-cat="vpn" aria-pressed="false">VPN</button>
        <button class="cat" type="button" data-cat="tools" aria-pressed="false">Tools</button>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title" aria-label="SONSIRO APP STORE"><img class="hero-mark" src="assets/sonsiro-infinity-emblem.png" alt=""></h1>
        <p class="intro">Ứng dụng của bạn, tải nhanh và đơn giản.</p>
        <label class="search glass">
          <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <input id="search" type="search" placeholder="Tìm ứng dụng..." autocomplete="off" aria-label="Tìm ứng dụng">
          <kbd>⌘ K</kbd>
        </label>
      </section>
      <section class="apps" id="apps" aria-labelledby="apps-title">
        <div class="section-head"><div><h2 id="apps-title">Ứng dụng</h2><span class="count" id="count" aria-live="polite"></span></div></div>
        <div class="grid" id="grid" data-gesture-surface role="group" aria-label="Danh sách ứng dụng"></div>
      </section>
    </main>
    <footer>© 2026 Sonsiro · Liquid Glass App Store</footer>
  </div>

  <nav class="dock glass" aria-label="Điều hướng nhanh">
    <a class="active" href="#top"><span class="dock-icon" aria-hidden="true">⌂</span><small>Home</small></a>
    <a href="#apps"><span class="dock-icon" aria-hidden="true">▦</span><small>Apps</small></a>
    <a href="https://github.com/Sonsiro/sonsiro.github.io/releases" target="_blank" rel="noreferrer"><span class="dock-icon" aria-hidden="true">⬇</span><small>Releases</small></a>
    <a href="https://github.com/Sonsiro/" target="_blank" rel="noreferrer"><span class="dock-icon" aria-hidden="true">◈</span><small>GitHub</small></a>
  </nav>

  <script>
    const apps = [
      { name: "SIRO-TV", type: "Android TV", cat: "tv", icon: '<svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="m12 8 6 4 6-4M8 14h20v14H8z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><text x="18" y="24" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="8" font-weight="800">TV</text></svg>', cls: "", desc: "Ứng dụng xem TV dành cho Android TV.", version: "Latest", url: "https://github.com/Sonsiro/sonsiro.github.io/releases/download/apps/SIRO-ATV.apk" },
      { name: "SIRO-TV", type: "Android Phone", cat: "android", icon: '<svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M10 12.5h16a2.5 2.5 0 0 1 2.5 2.5v10a2.5 2.5 0 0 1-2.5 2.5H10A2.5 2.5 0 0 1 7.5 25V15a2.5 2.5 0 0 1 2.5-2.5Z" stroke="currentColor" stroke-width="2.3"/><path d="m13 9-2-3m12 3 2-3M13 18h.01M23 18h.01" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><path d="M18 12v15" stroke="currentColor" stroke-width="2.3"/></svg>', cls: "phone", desc: "Ứng dụng SIRO-TV dành cho điện thoại Android.", version: "Latest", url: "https://github.com/Sonsiro/sonsiro.github.io/releases/download/apps/SIRO-TV.apk" },
      { name: "SIRO-VPN", type: "VPN", cat: "vpn", icon: '<svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M18 4.5 29 9v8.2c0 7.2-4.7 12.2-11 14.3C11.7 29.4 7 24.4 7 17.2V9l11-4.5Z" fill="rgba(255,255,255,.22)" stroke="currentColor" stroke-width="2.2"/><path d="m13.2 18.2 3.1 3.1 6.7-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>', cls: "vpn", desc: "Ứng dụng VPN Sonsiro cho Android.", version: "Latest", url: "https://github.com/Sonsiro/sonsiro.github.io/releases/download/apps/SIRO-VPN.apk" },
      { name: "TizenTube", type: "Samsung Tizen TV", cat: "tv", icon: "TT", cls: "tt", desc: "Ứng dụng YouTube dành cho TV Samsung chạy Tizen.", version: "Latest", url: "https://github.com/Sonsiro/sonsiro.github.io/releases/download/apps/tizenyoutube.apk" },
      { name: "SmartTube", type: "Android TV", cat: "tv", icon: "ST", cls: "st", desc: "SmartTube Stable — ứng dụng YouTube tối ưu cho Android TV.", version: "Stable", url: "https://github.com/Sonsiro/sonsiro.github.io/releases/download/apps/smarttube.apk" },
      { name: "Get Out", type: "Android", cat: "tools", icon: "GO", cls: "go", desc: "Ứng dụng Get Out dành cho Android.", version: "Latest", url: "https://github.com/Sonsiro/sonsiro.github.io/releases/download/apps/getout.apk" },
    ];
    const grid = document.querySelector("#grid");
    const search = document.querySelector("#search");
    const count = document.querySelector("#count");
    const cats = [...document.querySelectorAll(".cat")];
    let activeCat = "all";

    function render() {
      const query = search.value.toLocaleLowerCase("vi").trim();
      const filtered = apps.filter(app => {
        const categoryMatch = activeCat === "all" || app.cat === activeCat;
        const textMatch = `${app.name} ${app.type} ${app.desc}`.toLocaleLowerCase("vi").includes(query);
        return categoryMatch && textMatch;
      });
      count.textContent = `${filtered.length} ứng dụng`;
      grid.innerHTML = filtered.length ? filtered.map(app => `
        <article class="card glass">
          <div class="card-top">
            <div class="icon ${app.cls}" aria-hidden="true">${app.icon}</div>
            <div class="card-meta"><h3>${app.type}</h3><span class="app-name">${app.name}</span></div>
          </div>
          <p>${app.desc}</p>
          <div class="bottom"><span class="version">${app.version}</span><a class="download" href="${app.url}">Tải xuống <span aria-hidden="true">↓</span></a></div>
        </article>`).join("") : '<div class="empty glass">Không tìm thấy ứng dụng phù hợp.</div>';
    }

    cats.forEach(button => button.addEventListener("click", () => {
      activeCat = button.dataset.cat;
      cats.forEach(item => {
        const selected = item === button;
        item.classList.toggle("active", selected);
        item.setAttribute("aria-pressed", String(selected));
      });
      render();
    }));
    search.addEventListener("input", render);
    document.addEventListener("app:back", event => {
      if (search.value) {
        search.value = "";
        render();
        event.preventDefault();
      } else if (activeCat !== "all") {
        cats.find(button => button.dataset.cat === "all")?.click();
        event.preventDefault();
      }
    });
    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        search.focus();
      }
    });
    render();
  </script>
  <script src="input-navigation.js"></script>
</body>
</html>
